name: Checks and GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-and-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.17.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up native Python reference environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Front-end and canonical-model tests
        run: npm test

      - name: Native pandapower adapter tests
        run: python -m pytest tests/python --junitxml=test-results/native-tests.xml

      # Reference fixtures are reviewed source data. Never regenerate them in CI.
      - name: Provision integrity-pinned browser runtime
        run: npm run provision:runtime

      - name: Pyodide numerical parity in the Node WASM runtime
        run: npm run test:runtime

      - name: Independently re-import actual-WASM RAW exports
        run: python tests/python/verify_runtime_raw.py

      - name: Ensure tests did not rewrite committed reference fixtures
        run: git diff --exit-code -- public/fixtures

      - name: Build static site
        run: npm run build

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Check deployed entry point and sample availability
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "${PAGE_URL%/}/" --output /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "${PAGE_URL%/}/fixtures/case9.json" --output /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "${PAGE_URL%/}/runtime/runtime-manifest.json" --output /dev/null

